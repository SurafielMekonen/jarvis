name: Bouw Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Android SDK-onderdelen
        run: |
          set +o pipefail
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Bouw debug-APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publiceer APK als release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release create "build-${{ github.run_number }}" jarvis.apk \
            --title "Jarvis build ${{ github.run_number }}" \
            --notes "Debug-APK van Jarvis. Download jarvis.apk en installeer hem op je telefoon."

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
